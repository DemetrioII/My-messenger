syntax = "proto3";

package messenger.v1;

message ErrorMessage {
  uint32 code = 1;
  string text = 2;
}

message ResponseMessage {
  uint32 code = 1;
  string text = 2;
  repeated bytes metadata = 3;
  bytes payload = 4;
}

message Envelope {
  bytes sender = 1;
  bytes recipient = 2;
  uint64 sequence_number = 3;
  uint32 flags = 4;
}

message WireMessage {
  uint32 version = 1;
  uint32 message_type = 2;
  uint32 message_id = 3;
  uint32 checksum = 4;
  uint64 timestamp = 5;
  repeated bytes metadata = 6;
  bytes payload = 7;
  Envelope envelope = 8;
}
